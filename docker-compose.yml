# Pinned so the project name does not follow the directory. Without it
# Compose derives it from the folder, and moving or renaming this checkout
# makes Docker look for volumes that do not exist: it creates empty ones
# and the data that was there is orphaned rather than lost loudly.
name: takehome-codefusion-research-agent

services:
  web:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - media_data:/app/media
    ports:
      - "8080:8000"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: research
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  media_data:
